# cargo-deny configuration. CI runs `cargo deny check`; a dependency whose
# license is outside this allowlist needs explicit maintainer sign-off.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version; that is not the wildcard
# hazard this lint exists for.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained (archived by its author), pulled in by metal-rs
    # 0.29 with no fixed release. Proc-macro only, no runtime surface;
    # revisit when metal-rs moves off it.
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
