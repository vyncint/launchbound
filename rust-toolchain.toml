# Pinned in lockstep with cuda-oxide and reconverge (CONTRIBUTING.md).
# reconverge is a rustc-driver tool: it must be built by the exact rustc it
# wraps, and cuda-oxide projects require the same pin. The three pins move
# together or not at all; a bump is its own commit with its own gate re-run.
#
# Current lockstep set:
#   nightly     nightly-2026-08-28
#   cuda-oxide  b0f961df3af0ff140b3b006fa2b6750b71f43f62
#   reconverge  v0.7.0
[toolchain]
channel = "nightly-2026-08-28"
components = ["rustfmt", "clippy"]
