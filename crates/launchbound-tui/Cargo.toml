[package]
name = "launchbound-tui"
description = "TUI over a run directory: space, progress, ranking, and the rejection view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "launchbound-tui"
path = "src/main.rs"

[dependencies]
launchbound-report = { workspace = true }
anyhow = { workspace = true }
crossterm = "0.29"
ratatui = "0.30"

[dev-dependencies]
# `serde` for the Screen <-> JSON round trip in tests/emulation.rs, and so a
# failing wait under `TERMLENS_ARTIFACT_DIR` leaves `.screen.json` rather than
# `.screen.txt` — which is what the report action in CI renders. `insta` (the
# crate's default) stays off: goldens here go through LAUNCHBOUND_BLESS.
termlens = { version = "0.11", default-features = false, features = ["serde"] }
serde_json = { workspace = true }
