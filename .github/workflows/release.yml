# Release: on a version tag, run the full test suite, then publish every
# workspace crate to crates.io in dependency order via Trusted Publishing
# (GitHub OIDC — no long-lived token anywhere). Publishing is triggered only
# by a maintainer pushing a tag — never automatically.
name: release

on:
  push:
    # Full versions only: the floating v1 action tag moves on releases and
    # must not re-trigger publishing.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  # Manual re-run for resuming a rate-limited publish; skips crates whose
  # version is already on the registry.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: crates.io trusts this repo+workflow via OIDC and
      # mints a short-lived token; no secret lives anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Authenticate with crates.io (OIDC, tokenless)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='launchbound-cli'))")
          # The tag is the contract: on a tag push, refuse to publish a
          # manifest that disagrees with it. This is the real barrier — the
          # trigger glob is only defense-in-depth (GitHub's `*` matches any
          # characters, so v1.2.3-rc1 style tags still trigger).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version — refusing to publish"
              exit 1
            fi
          else
            echo "::warning::manual dispatch publishes main's Cargo.toml version ($version); versions already on crates.io are skipped"
          fi
          echo "publishing version $version"
          for crate in \
              launchbound-space \
              launchbound-bench \
              launchbound-build \
              launchbound-prune \
              launchbound-search \
              launchbound-model \
              launchbound-metal \
              launchbound-report \
              launchbound-runner \
              launchbound-tui \
              launchbound-cli; do
            if curl -fsS -A "launchbound-release (github.com/vyncint/launchbound)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "== $crate $version already on crates.io — skipping =="
              continue
            fi
            echo "== publishing $crate =="
            for attempt in $(seq 1 12); do
              if cargo publish -p "$crate" --no-verify 2>&1 | tee /tmp/publish.log; then
                break
              fi
              if grep -q "already uploaded\|already exists" /tmp/publish.log; then
                echo "$crate already published (crossed with a previous run)"; break
              fi
              if [ "$attempt" = 12 ]; then
                echo "publishing $crate failed after 12 attempts"; exit 1
              fi
              if grep -q "429 Too Many Requests" /tmp/publish.log; then
                echo "rate-limited; waiting 10 minutes (crates.io new-crate bucket refills ~1/10min)"
                sleep 610
              else
                echo "retry $attempt for $crate in 30s (index propagation)"
                sleep 30
              fi
            done
          done

  # Move the floating major tag to the release that was just published.
  #
  # The README tells users to write `vyncint/launchbound/action@v1`, so that
  # tag is the contract for everyone who followed the documentation. It was a
  # manual step, and a manual step in a release is a step that gets skipped:
  # `v1` sat on 1.0.2 through both 1.1.0 and 1.2.0, so every consumer on the
  # documented ref kept getting an action pinned to reconverge 0.1.11 while
  # 1.2.0's entire subject was moving that pin to 0.3.0.
  #
  # Runs only after a successful publish, and only for a tag push, so the
  # floating tag can never point at a release that did not reach crates.io.
  # The trigger filter above requires three numeric components, so pushing
  # `v1` here cannot re-enter this workflow.
  float-major-tag:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # moves refs/tags/vN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point vN at ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="v${TAG#v}"
          major="${major%%.*}"
          case "$major" in
            v[0-9]*) ;;
            *) echo "::error::cannot derive a major tag from '$TAG'"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $TAG ($(git rev-parse --short "$TAG^{commit}"))"

  # Tell the repository that tests this tool against real kernels that a new
  # version exists, so the deep run happens now rather than at its next
  # scheduled tick.
  #
  # Best-effort by design. launchbound-action-demo resolves the newest
  # published launchbound-cli from crates.io on a schedule of its own, so a
  # dispatch that never arrives -- an expired token, a release cut by hand --
  # costs latency and nothing else. This job never fails the release: a
  # published crate is published whether or not the notification landed.
  #
  # Needs a PAT with `contents: write` on launchbound-action-demo, stored as
  # TESTING_REPO_DISPATCH_TOKEN. Without it the job says so and exits clean.
  notify-testing-repo:
    name: notify-testing-repo
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch to launchbound-action-demo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TESTING_REPO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::TESTING_REPO_DISPATCH_TOKEN is not set; launchbound-action-demo will pick this up on its own schedule instead"
            exit 0
          fi
          gh api repos/vyncint/launchbound-action-demo/dispatches \
            -f event_type=tool-published \
            -F "client_payload[version]=${TAG#v}" \
            && echo "dispatched tool-published to launchbound-action-demo" \
            || echo "::warning::could not dispatch to launchbound-action-demo; it will pick this up on its own schedule"
