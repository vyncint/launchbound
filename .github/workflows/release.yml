# Release: on a version tag, run the full test suite, then publish every
# workspace crate to crates.io in dependency order. Publishing is triggered
# only by a maintainer pushing a tag — never automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in \
              launchbound-space \
              launchbound-bench \
              launchbound-build \
              launchbound-prune \
              launchbound-search \
              launchbound-model \
              launchbound-metal \
              launchbound-report \
              launchbound-runner \
              launchbound-tui \
              launchbound-cli; do
            echo "== publishing $crate =="
            # Retry while the index propagates the previous crate.
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$crate" --no-verify; then
                break
              elif [ "$attempt" = 5 ]; then
                echo "publishing $crate failed after 5 attempts"; exit 1
              else
                echo "retry $attempt for $crate in 30s (index propagation)"; sleep 30
              fi
            done
          done
