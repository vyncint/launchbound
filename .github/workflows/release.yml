# Release: on a version tag, run the full test suite, then publish every
# workspace crate to crates.io in dependency order. Publishing is triggered
# only by a maintainer pushing a tag — never automatically.
name: release

on:
  push:
    tags: ["v*"]
  # Manual re-run for resuming a rate-limited publish; skips crates whose
  # version is already on the registry.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "publishing version $version"
          for crate in \
              launchbound-space \
              launchbound-bench \
              launchbound-build \
              launchbound-prune \
              launchbound-search \
              launchbound-model \
              launchbound-metal \
              launchbound-report \
              launchbound-runner \
              launchbound-tui \
              launchbound-cli; do
            if curl -fsS "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "== $crate $version already on crates.io — skipping =="
              continue
            fi
            echo "== publishing $crate =="
            for attempt in $(seq 1 12); do
              if cargo publish -p "$crate" --no-verify 2>&1 | tee /tmp/publish.log; then
                break
              fi
              if grep -q "already uploaded\|already exists" /tmp/publish.log; then
                echo "$crate already published (crossed with a previous run)"; break
              fi
              if [ "$attempt" = 12 ]; then
                echo "publishing $crate failed after 12 attempts"; exit 1
              fi
              if grep -q "429 Too Many Requests" /tmp/publish.log; then
                echo "rate-limited; waiting 10 minutes (crates.io new-crate bucket refills ~1/10min)"
                sleep 610
              else
                echo "retry $attempt for $crate in 30s (index propagation)"
                sleep 30
              fi
            done
          done
