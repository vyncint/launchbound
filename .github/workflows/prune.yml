# The one CI job that exercises the product thesis, and it needs no
# hardware: the safety gate over the whole corpus on a plain runner
# (CONTRIBUTING.md). Provisions the pinned cuda-oxide checkout and a pinned
# cargo-reconverge, then runs the gate tests and the corpus prune.
name: prune

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The lockstep pin pair, written once. A pin bump touches this block,
# rust-toolchain.toml, and the action defaults (action/action.yml) — the
# pins.yml issue body lists every site.
env:
  PINNED_TOOLCHAIN: nightly-2026-04-03
  RECONVERGE_VERSION: "0.1.11"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The corpus expects the cuda-oxide checkout as a sibling.
          path: launchbound
      - name: Check out pinned cuda-oxide as sibling
        uses: actions/checkout@v4
        with:
          repository: NVlabs/cuda-oxide
          ref: 50d07314eb8b7d5ec821ba02b0048a753c20dd4e
          path: cuda-oxide
      - name: Install pinned toolchain
        working-directory: launchbound
        run: rustup show
      # Installed every run, never restored from a cache. This job exists to
      # prove the safety gate holds against the *published* analyzer, and a
      # cached binary is not evidence of that: it is evidence about whatever
      # crates.io served the day the cache was filled. The action this
      # repository ships makes the same promise in the same words — "from
      # crates.io, built here, never a cached binary" — and a gate that
      # cannot be trusted to be current is worth less than the minutes it
      # saves.
      - name: Install pinned cargo-reconverge + driver from crates.io
        run: |
          rustup component add rustc-dev llvm-tools rust-src --toolchain "$PINNED_TOOLCHAIN"
          cargo "+$PINNED_TOOLCHAIN" install --locked cargo-reconverge --version "$RECONVERGE_VERSION"
          cargo "+$PINNED_TOOLCHAIN" install --locked reconverge-driver --version "$RECONVERGE_VERSION"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Gate tests (the most important in the repo)
        working-directory: launchbound
        run: just gate
      - name: Safety gate over the whole corpus
        working-directory: launchbound
        run: just prune
