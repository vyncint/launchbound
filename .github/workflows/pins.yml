# Pin watch: reports when cuda-oxide or reconverge move upstream by opening an
# issue. It NEVER bumps a pin — a bump is a human decision, its own commit,
# and a gate re-run (CONTRIBUTING.md).
#
# It runs weekly. It did not always: the schedule was commented out, so the
# watch only spoke when somebody dispatched it, and between 2026-08-31 and
# 2026-09-09 upstream moved 133 commits and one toolchain with nothing said.
# A watch that runs when you remember to ask it is a watch you do not have.
name: pins

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The lockstep pin set. A pin bump updates these values (and
# rust-toolchain.toml) in its own commit.
env:
  CUDA_OXIDE_PIN: 26754ae52c26c097dc1c465a1e42c4c5d05a3d40
  CUDA_OXIDE_REPO: NVlabs/cuda-oxide
  RECONVERGE_PIN: v0.6.0
  RECONVERGE_REPO: vyncint/reconverge

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Needed for the toolchain comparison: the nightly we pin lives in
      # rust-toolchain.toml, not in this file's env block.
      - uses: actions/checkout@v4
        with:
          # This job reads one file and talks to `gh api` with the job token;
          # it never pushes, so the checkout credential is pure attack surface.
          persist-credentials: false

      - name: Compare upstreams to pins
        run: |
          set -euo pipefail
          drift=""

          head_sha=$(gh api "repos/$CUDA_OXIDE_REPO/commits/HEAD" -q '.sha')
          if [ "$head_sha" != "$CUDA_OXIDE_PIN" ]; then
            drift="$drift- \`$CUDA_OXIDE_REPO\` HEAD is \`${head_sha:0:8}\`, pin is \`${CUDA_OXIDE_PIN:0:8}\`"$'\n'
          fi

          # The toolchain, which is the pin that actually breaks things. A
          # commit-count drift is usually docs; a channel move means our
          # rustc can no longer build upstream's kernels, and reconverge --
          # a rustc driver -- must be rebuilt against it. Reported as its own
          # line so a reader can tell the two apart at a glance, which the
          # sha-only report of #1201 did not let anyone do.
          ours=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          theirs=$(gh api "repos/$CUDA_OXIDE_REPO/contents/rust-toolchain.toml" \
            -H "Accept: application/vnd.github.raw" | sed -n 's/^channel = "\(.*\)"/\1/p')
          # An extractor that silently matches nothing is the same failure as
          # a stale pin, one level up: it reports "current" forever. Fail loud.
          if [ -z "$ours" ] || [ -z "$theirs" ]; then
            echo "could not read a toolchain channel (ours='$ours' theirs='$theirs') -- has rust-toolchain.toml changed shape?" >&2
            exit 1
          fi
          if [ "$ours" != "$theirs" ]; then
            drift="$drift- \`$CUDA_OXIDE_REPO\` builds on \`$theirs\`, \`rust-toolchain.toml\` pins \`$ours\` **(toolchain move — reconverge must be rebuilt)**"$'\n'
          fi

          latest_tag=$(gh api "repos/$RECONVERGE_REPO/tags" -q '.[0].name')
          if [ "$latest_tag" != "$RECONVERGE_PIN" ]; then
            drift="$drift- \`$RECONVERGE_REPO\` latest tag is \`$latest_tag\`, pin is \`$RECONVERGE_PIN\`"$'\n'
          fi

          if [ -z "$drift" ]; then
            echo "Pins current."
            exit 0
          fi

          echo "$drift"

          title="pins: upstream moved past the lockstep pin set"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$title\"" --json title -q '.[].title' | grep -qF "$title"; then
            echo "Drift detected but an open issue already reports it."
            exit 0
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf 'Weekly pin watch found upstream movement:\n\n%s\nPolicy (CONTRIBUTING.md): the nightly, cuda-oxide, and reconverge pins move together or not at all. A bump is its own commit with its own gate re-run, touching EVERY site — `scripts/check-pins.sh` is the list and it fails on disagreement: rust-toolchain.toml, README.md (the toolchain badge), .github/workflows/pins.yml (env), .github/workflows/prune.yml (env), action/action.yml (input defaults), action/README.md, docs/LIMITATIONS.md, corpus/README.md, crates/launchbound-build/src/compile.rs (CUDA_OXIDE_PIN), and CONTRIBUTING.md. This workflow never bumps — a human decides.' "$drift")"
